root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -buildvcs=false -o ./bin/app ./cmd/app && templ generate --notify-proxy" 
  args_bin = []
  bin = "./bin/app"
  delay = 0
  exclude_dir = ["bin", "public/uploads", "node_modules", "tmp"]
  exclude_file = []
  exclude_regex = ["_test.go", ".*_templ.go", ".*_templ.txt"]
  exclude_unchanged = true
  follow_symlink = false
  include_ext = ["go", "templ", "html", "css"]
  kill_delay = "0s"
  log = "build-errors.log"
  poll = false
  poll_interval = 0
  rerun = false
  rerun_delay = 500
  send_interrupt = false
  stop_on_error = true

[color]
  app = "magenta"
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = true
  time = true

[misc]
  clean_on_exit = false

[screen]
  keep_scroll = true
